name: Windows reflective proof

on:
  pull_request:
  push:
    branches:
      - main
      - "proposal/**"

jobs:
  reflective-proof:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Test Go reflective implementation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          go version | Tee-Object -FilePath artifacts\build-proof.txt
          go test ./internal/hq ./cmd/hq-reflective ./cmd/hq 2>&1 | Tee-Object -FilePath artifacts\go-test.txt
          Get-Content artifacts\go-test.txt | Add-Content artifacts\build-proof.txt

      - name: Build Windows proof binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          go build -o artifacts/hq-reflective-windows-amd64.exe ./cmd/hq-reflective
          Get-Item artifacts\hq-reflective-windows-amd64.exe | Format-List Name,Length,FullName | Out-String | Add-Content artifacts\build-proof.txt
          Get-FileHash artifacts\hq-reflective-windows-amd64.exe -Algorithm SHA256 | Format-List | Out-String | Add-Content artifacts\build-proof.txt

      - name: Run Windows proof smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts | Out-Null

          $keyArg = '{"'
          $completeArg = '{"op":q'
          $contextArg = '{"'
          $draftArg = '{"op":"queue.create","target":"ctx","payload":{"path":"demo.jsonl"}}'

          & .\artifacts\hq-reflective-windows-amd64.exe --complete $keyArg | Tee-Object -FilePath artifacts\key-completion.json
          & .\artifacts\hq-reflective-windows-amd64.exe --complete $completeArg | Tee-Object -FilePath artifacts\complete.json
          & .\artifacts\hq-reflective-windows-amd64.exe --context $contextArg | Tee-Object -FilePath artifacts\context.json
          & .\artifacts\hq-reflective-windows-amd64.exe --draft $draftArg | Tee-Object -FilePath artifacts\draft.json

          $keyComplete = Get-Content artifacts\key-completion.json -Raw | ConvertFrom-Json
          if (-not ($keyComplete | Where-Object { $_.label -eq '"op"' })) {
            throw "op key completion was not present"
          }

          $complete = Get-Content artifacts\complete.json -Raw | ConvertFrom-Json
          if (-not ($complete | Where-Object { $_.label -eq "queue.create" })) {
            throw "queue.create completion was not present"
          }
          if (-not ($complete | Where-Object { $_.compileDraft.queue -eq "instruction.jsonl" })) {
            throw "compileDraft queue proof was not present"
          }

          @(
            "actual Windows CI run: .\artifacts\hq-reflective-windows-amd64.exe built in this workflow",
            "",
            "PS> .\artifacts\hq-reflective-windows-amd64.exe --complete '$completeArg'",
            (Get-Content artifacts\complete.json -Raw),
            "",
            "PS> .\artifacts\hq-reflective-windows-amd64.exe --context '$contextArg'",
            (Get-Content artifacts\context.json -Raw),
            "",
            "PS> .\artifacts\hq-reflective-windows-amd64.exe --draft '$draftArg'",
            (Get-Content artifacts\draft.json -Raw)
          ) -join "`r`n" | Set-Content -Encoding UTF8 artifacts\actual-run-terminal-proof.txt

      - name: Render actual run contact sheet
        shell: pwsh
        run: |
          .\scripts\render-actual-run-contact-sheet.ps1 `
            -BuildProofPath artifacts\build-proof.txt `
            -KeyCompletionPath artifacts\key-completion.json `
            -OpCompletionPath artifacts\complete.json `
            -DraftPath artifacts\draft.json `
            -OutputPath artifacts\actual-run-contact-sheet.png

      - uses: actions/upload-artifact@v4
        with:
          name: hq-reflective-windows-actual-run-proof
          path: |
            artifacts/hq-reflective-windows-amd64.exe
            artifacts/build-proof.txt
            artifacts/go-test.txt
            artifacts/key-completion.json
            artifacts/complete.json
            artifacts/context.json
            artifacts/draft.json
            artifacts/actual-run-terminal-proof.txt
            artifacts/actual-run-contact-sheet.png
          if-no-files-found: error
