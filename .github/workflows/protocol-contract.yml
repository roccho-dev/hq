name: Protocol contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  protocol-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: go test ./internal/hq -run TestProtocolFixtureContract -v
      - run: PYTHONPATH=. python3 -m unittest tests/test_python_reference_protocol_fixture.py
      - uses: actions/upload-artifact@v4
        with:
          name: hq-protocol-contract-fixtures
          path: spec/fixtures/protocol-contract.json
          if-no-files-found: error
