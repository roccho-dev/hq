name: Official hq artifacts

on:
  pull_request:
    paths:
      - .github/workflows/official-hq-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-official-hq-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download immutable official Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hq-official-3118886f"
          tag=hq-artifact-3118886f34ac5615e8a7732a6297bd41900e21e1
          source_sha=3118886f34ac5615e8a7732a6297bd41900e21e1
          mkdir -p "$out/release" "$out/runtime/bin" "$out/logs"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish,assets > "$out/logs/release.json"
          test "$(jq -r .targetCommitish "$out/logs/release.json")" = "$source_sha"
          test "$(jq -r '.assets | length' "$out/logs/release.json")" = 8
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$out/release"
          (cd "$out/release" && sha256sum --check SHA256SUMS) > "$out/logs/release-checksums.txt"
          test "$(jq -r .source_sha "$out/release/manifest-linux-amd64.json")" = "$source_sha"
          test "$(jq -r .go_version "$out/release/manifest-linux-amd64.json")" = go1.23.12
          test "$(jq -r .os "$out/release/manifest-linux-amd64.json")" = linux
          test "$(jq -r .arch "$out/release/manifest-linux-amd64.json")" = amd64
          install -m 0555 "$out/release/hq-linux-amd64" "$out/runtime/bin/hq"
          install -m 0555 "$out/release/hq-worker-linux-amd64" "$out/runtime/bin/hq-worker"
          for binary in hq hq-worker; do
            go version -m "$out/runtime/bin/$binary" > "$out/logs/$binary.buildinfo.txt"
            grep -F "vcs.revision=$source_sha" "$out/logs/$binary.buildinfo.txt"
            grep -F 'vcs.modified=false' "$out/logs/$binary.buildinfo.txt"
            "$out/runtime/bin/$binary" --help > "$out/logs/$binary.help.txt"
          done
          python3 - "$out" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          receipt = {
            "schema": "hq.officialLinuxCarryReadback/1",
            "status": "PASS",
            "sourceCommit": "3118886f34ac5615e8a7732a6297bd41900e21e1",
            "releaseTag": "hq-artifact-3118886f34ac5615e8a7732a6297bd41900e21e1",
            "hqSha256": sha(root/"runtime/bin/hq"),
            "workerSha256": sha(root/"runtime/bin/hq-worker"),
            "goVersion": "go1.23.12",
            "vcsModified": False,
            "artifactIsTransportProjection": True
          }
          (root/"receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
          (cd "$out" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$out" && sha256sum --check SHA256SUMS)

      - name: Upload exact official Linux runtime
        uses: actions/upload-artifact@v4
        with:
          name: hq-official-linux-3118886f
          path: ${{ runner.temp }}/hq-official-3118886f
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
