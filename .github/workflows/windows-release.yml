name: Rust Windows build and release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-rust:
    name: Build Rust Windows artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: rustc --version && cargo --version

      - name: Build Rust release binary
        run: cargo build --release

      - name: Capture Rust proof output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist\hq-windows-rust | Out-Null
          target\release\hq.exe demo-autocomplete > dist\hq-windows-rust\hq-demo-autocomplete.txt

      - name: Package Rust artifact only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item target\release\hq.exe dist\hq-windows-rust\hq.exe
          @'
          hq Windows Rust artifact

          This package is built by GitHub Actions from the proposal PR.
          It contains only the Rust-built hq.exe, README, and proof output.

          The binary includes:
          - hq suggest --buffer <json-fragment> [--query <text>]
          - hq accept  --buffer <json-fragment> [--query <text>] [--index <n>]
          - hq demo-autocomplete

          It supports matcher-ranked suggestions and queue.create JSONL output.
          Full interactive REPL rendering remains future work.
          '@ | Set-Content -NoNewline -Encoding utf8 dist\hq-windows-rust\README.txt
          Compress-Archive -Path dist\hq-windows-rust\* -DestinationPath dist\hq-windows-rust.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: hq-windows-rust
          path: dist/hq-windows-rust.zip
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release asset
    needs: windows-rust
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hq-windows-rust
          path: dist

      - name: Create or update release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/hq-windows-rust.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" dist/hq-windows-rust.zip --repo "$GITHUB_REPOSITORY" --title "$TAG_NAME" --notes "hq Windows Rust artifact"
          fi
