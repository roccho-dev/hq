name: Rust Windows build and release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-rust:
    name: Build Rust Windows artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: rustc --version && cargo --version

      - name: Run Rust tests
        run: cargo test

      - name: Build Rust release binary
        run: cargo build --release

      - name: Package Rust artifact only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist\hq-windows-rust | Out-Null
          Copy-Item target\release\hq.exe dist\hq-windows-rust\hq.exe
          @'
          hq Windows Rust artifact

          This package is built by GitHub Actions from the proposal PR.
          It contains only the Rust-built hq.exe plus this README.

          This artifact proves the Rust Windows release path only.
          It does not claim that runtime REPL completion is complete.
          '@ | Set-Content -NoNewline -Encoding utf8 dist\hq-windows-rust\README.txt
          Compress-Archive -Path dist\hq-windows-rust\* -DestinationPath dist\hq-windows-rust.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: hq-windows-rust
          path: dist/hq-windows-rust.zip
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release asset
    needs: windows-rust
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hq-windows-rust
          path: dist

      - name: Create or update release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/hq-windows-rust.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" dist/hq-windows-rust.zip --repo "$GITHUB_REPOSITORY" --title "$TAG_NAME" --notes "hq Windows Rust artifact"
          fi
