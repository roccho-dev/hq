name: Windows package and release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-package:
    name: Build Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests on Windows
        run: python -m unittest discover -s tests

      - name: Build Windows zip package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist\hq-windows | Out-Null
          Copy-Item -Recurse hq dist\hq-windows\hq
          Copy-Item README.md dist\hq-windows\README.md
          @'
          @echo off
          python -m hq %*
          '@ | Set-Content -NoNewline -Encoding ascii dist\hq-windows\hq.cmd
          python -m hq demo-autocomplete > dist\hq-windows\hq-terminal-autocomplete.txt
          Compress-Archive -Path dist\hq-windows\* -DestinationPath dist\hq-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: hq-windows
          path: dist/hq-windows.zip
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release asset
    needs: windows-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hq-windows
          path: dist

      - name: Create or update release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/hq-windows.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" dist/hq-windows.zip --repo "$GITHUB_REPOSITORY" --title "$TAG_NAME" --notes "hq Windows package"
          fi
